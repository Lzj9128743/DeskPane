name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore .\src\DeskPane\DeskPane.csproj -p:Platform=x64 -p:RuntimeIdentifier=win-x64
          dotnet restore .\tests\DeskPane.Tests\DeskPane.Tests.csproj -p:Platform=x64 -p:RuntimeIdentifier=win-x64

      - name: Build
        run: dotnet build .\src\DeskPane\DeskPane.csproj --configuration Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true -p:WindowsAppSDKSelfContained=true -p:DeskPaneShellThumbnailProxy=false -p:DeskPaneRustNative=false -v:minimal

      - name: Test
        timeout-minutes: 10
        run: dotnet test .\tests\DeskPane.Tests\DeskPane.Tests.csproj --configuration Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:WindowsAppSdkBootstrapInitialize=false -p:DeskPaneShellThumbnailProxy=false -p:DeskPaneRustNative=false --blame-hang --blame-hang-timeout 2m --logger "trx;LogFileName=test-results.trx" -v:minimal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/DeskPane.Tests/TestResults/**/*.trx
