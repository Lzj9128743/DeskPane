name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release-x64:
    name: Build and publish Release (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          $version = $tag.TrimStart('v')
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          dotnet publish .\src\DeskPane\DeskPane.csproj `
            --configuration Release `
            -p:Platform=x64 `
            -p:RuntimeIdentifier=win-x64 `
            -p:SelfContained=true `
            -p:WindowsAppSDKSelfContained=true `
            -p:DeskPaneShellThumbnailProxy=false `
            -p:DeskPaneRustNative=false `
            -p:Version=${{ steps.meta.outputs.version }} `
            -p:FileVersion=${{ steps.meta.outputs.version }}.0 `
            -p:AssemblyVersion=${{ steps.meta.outputs.version }}.0 `
            -o .\release-out\DeskPane

      - name: Build Inno Setup installer (.exe)
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $version = "${{ steps.meta.outputs.version }}"
          $setupBase = "DeskPane-Setup-$tag-win-x64"
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc ".\installer\DeskPane.Setup.iss" "/DMyAppVersion=$version" "/DSourceDir=..\release-out\DeskPane" "/DOutputBaseName=$setupBase"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable ZIP and SHA256
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $zipName = "DeskPane-$tag-win-x64.zip"
          $exeName = "DeskPane-Setup-$tag-win-x64.exe"
          Compress-Archive -Path ".\release-out\DeskPane\*" -DestinationPath ".\$zipName" -Force
          foreach ($f in @($zipName, $exeName)) {
            $hash = (Get-FileHash -Path ".\$f" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $f" | Set-Content -Path ".\$f.sha256" -Encoding ASCII
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: DeskPane ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            DeskPane-Setup-${{ steps.meta.outputs.tag }}-win-x64.exe
            DeskPane-Setup-${{ steps.meta.outputs.tag }}-win-x64.exe.sha256
            DeskPane-${{ steps.meta.outputs.tag }}-win-x64.zip
            DeskPane-${{ steps.meta.outputs.tag }}-win-x64.zip.sha256
